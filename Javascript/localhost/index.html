<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Localhost</title>
  </head>
  <body>
    <div id="auth_container">
      <input type="text" id="user_name" placeholder="User name" />
      <input type="email" id="user_email" placeholder="Email" />
      <button id="login_btn">Login</button>
    </div>

    <div id="user_container">
      <h1>Welcome <span id="user_display_name"></span></h1>

      <div>
        <input  type="text" placeholder="Todo" id="todo_input"/>
        <button id="todo_btn">Add</button>
      </div>

      <div id="todo_container">

      </div>
      <br>

      <button id="logout_btn">Logout</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
