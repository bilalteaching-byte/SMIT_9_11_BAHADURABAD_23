<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>

  <body>
    <div
      id="loading_container"
      style="
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        background-color: #f4f4f4;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 4px solid #e0e0e0;
          border-top: 4px solid #4a90e2;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        "
      ></div>

      <h4
        style="
          color: #555;
          font-family: Arial, sans-serif;
          font-weight: normal;
          margin: 0;
        "
      >
        Loading...
      </h4>
    </div>

    <div id="auth_container">
      <div id="register_box">
        <h1>Register User</h1>
        <input type="text" id="name" placeholder="Full Name" />
        <input type="email" id="register_email" placeholder="Email" />
        <input type="password" id="register_password" placeholder="Password" />
        <button id="registerBtn">Register</button>
        <p class="toggle_text">
          Already have an account? <span id="showLogin">Login</span>
        </p>
      </div>

      <div id="login_box">
        <h1>Login</h1>
        <input type="email" id="login_email" placeholder="Email" />
        <input type="password" id="login_password" placeholder="Password" />
        <button id="loginBtn">Login</button>
        <p class="toggle_text">
          Don't have an account? <span id="showRegister">Register</span>
        </p>
      </div>
    </div>

    <div id="dashboard_container" >
      <h1 id="welcomeMsg">Welcome to Firebase</h1>

      <input type="text" placeholder="Title" id="title" />
      <input type="text" placeholder="Description" id="description" />
      <button id="addPost">Add Doc</button>
      <button id="signoutBtn">Signout</button>

      <div id="allPosts"></div>
    </div>

    <script type="module" src="script.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
  </body>
</html>
