<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>

  <body>
    <div id="loading_container" class="loading_container">
      <div class="loading_inner">
        <div class="spinner"></div>
        <h4>Loading your notes…</h4>
      </div>
    </div>

    <div id="auth_container" class="auth_container">
      <div class="wordmark">
        <h1>Notes</h1>
        <p>A shared page for short thoughts.</p>
      </div>

      <div id="register_box" class="auth_box">
        <h2>Create an account</h2>
        <input type="text" id="name" placeholder="Full name" />
        <input type="email" id="register_email" placeholder="Email" />
        <input
          type="password"
          id="register_password"
          placeholder="Password"
        />
        <button id="registerBtn">Create account</button>
        <p class="toggle_text">
          Already have an account? <span id="showLogin">Log in</span>
        </p>
      </div>

      <div id="login_box" class="auth_box">
        <h2>Welcome back</h2>
        <input type="email" id="login_email" placeholder="Email" />
        <input type="password" id="login_password" placeholder="Password" />
        <button id="loginBtn">Log in</button>
        <p class="toggle_text">
          Don't have an account? <span id="showRegister">Create one</span>
        </p>
      </div>
    </div>

    <div id="dashboard_container" class="dashboard_container">
      <header class="dashboard_header">
        <div>
          <p class="eyebrow-free-wordmark">Notes</p>
          <h1 id="welcomeMsg">Welcome</h1>
        </div>
        <button id="signoutBtn" class="ghost_btn">Sign out</button>
      </header>

      <section class="compose_card">
        <input type="text" placeholder="Give it a title" id="title" />
        <input
          type="text"
          placeholder="What's on your mind?"
          id="description"
        />
        <button id="addPost">Post note</button>
      </section>

      <section class="filter_section">
        <p class="section_label">Filter by author</p>
        <div class="chips_row" id="users_chips"></div>
      </section>

      <section class="feed_section">
        <div id="allPosts"></div>
      </section>
    </div>

    <script type="module" src="script.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
  </body>
</html>
